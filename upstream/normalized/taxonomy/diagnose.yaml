  - id: diagnose.046
    kind: quote
    blanks: 1
    text: "> **근거:** 피동·이중피동 남용은 일한·영한 번역투의 대표 유형으로 보고된다(오경순 2010; 최유숙 2023).\n> 영-한 MT 품질평가는 이런 부자연성을 fluency 오류(\"Unnaturalness\")로 코딩한다(Park & Padó, LREC-COLING 2024)\n> → [`translationese-research.md`](../../translate-polish/references/translationese-research.md)."
