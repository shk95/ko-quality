    text: "> **근거:** 이 카테고리는 output-style 플러그인 [`snflkd/fluent-korean`](https://github.com/snflkd/fluent-korean)(MIT)이\n> 정리한 LLM 한국어 출력 특징을 윤문 관점으로 옮긴 것이다. 1~10번이 KatFishNet·번역학 연구에서 온 **과잉** 축이라면,\n> 이 축은 **과소**를 다룬다. 두 축은 반대 방향이므로 한쪽만 밀면 다른 쪽으로 넘어간다\n> → [보존 원칙의 '삭제 과교정 금지'](#삭제-과교정-금지).\n>\n> **전제 차이에 주의:** fluent-korean은 Claude가 **자기 글**을 쓸 때의 지침이라 필자가 맥락을 안다는 전제가 깔려 있다.\n> 윤문은 **남의 글**을 다루므로 그 전제가 없다. 아래 주의의 복원 한계가 그 차이를 메운다."
