    text: "> **근거:** 한국어 명사화는 체계기능언어학의 **문법적 은유**로, 학술·격식 텍스트의 정보밀도·객관적 문체를 만드는\n> 어휘문법 자원이다(정려란 2018; 소지영·주세형 2017 — 명사화는 고학년·학술 텍스트일수록 증가). 학술 문어가 절 확장이\n> 아니라 **명사구 압축**으로 복잡해진다는 영어권 정설과도 합치한다(Biber & Gray 2010). 따라서 명사화 과잉은\n> \"AI=격식·문어체 편향\"의 표지다. 단 **경동사 분리('활용을 하다'·한자어 대동사 '실시·수행·진행하다')를 번역투/AI 티로 규정한\n> 학술 1차 문헌은 미발굴**(2026-06 재조사 확인) → 홍성호(2020, 한국경제 '서술어 3종 세트')·이오덕·이수열\n> 글쓰기서·국립국어원 「쉬운 공문서 쓰기 길잡이」 등 **군더더기 간결화** 처방을 따른다.\n> [`translationese-research.md`](../../translate-polish/references/translationese-research.md) 참조."
