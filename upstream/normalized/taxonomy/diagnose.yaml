  - id: diagnose.035
    kind: quote
    blanks: 1
    text: "> **근거:** 한국 번역학은 직역 대명사·무생물 복수 '-들'·무생물 주어를 영한 번역투의 핵심 유형으로 분류한다\n> (김도훈 2009; 이영옥 2001; 최서영 2022). 이론적으로는 Toury(1995)의 간섭 법칙·Baker(1996)의 명시화로 설명되며,\n> Toral(2019)은 MT/AI 산출물에서 이 번역투가 오히려 *악화*됨을 보였다. **관형절 중첩·긴 전치수식**도 영한 번역문의\n> 대표 문제로, 영어 어순 모사·관형격 '의' 반복·다중 내포가 용인성·가독성을 떨어뜨린다(김혜영 2011; 성승은 2011 —\n> 번역서가 비번역서보다 관형절이 더 김). 단 좌분지는 한국어의 **정상** 특징이므로 '개수·길이'가 아니라 **번역투\n> 구조**일 때만 손본다(과교정 금지) → [`translationese-research.md`](../../translate-polish/references/translationese-research.md)."
    provenance:
