    kind: paragraph
    blanks: 1
    text: "AI(ChatGPT·Claude·Gemini 등)가 쓴 한글 텍스트에서 반복적으로 나타나는 \"AI 티\"를 11대 카테고리로\n정리한 탐지 기준이다. 각 항목은 **정의 · 패턴/예시 · 심각도 · 보존 주의**로 구성된다.\n1~10번은 말이 **넘쳐서** 생기는 티이고, 11번은 말이 **모자라서** 생기는 티다."
    provenance:
