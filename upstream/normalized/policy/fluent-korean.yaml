  - id: not-coding.04
    kind: item
    text: "- 이 문서에서 제시하는 지침들을 요약하는 것은 일반적으로 권장되지 않습니다. 그렇게 한다면 조항마다 첨부된 예시를 확인할 수 없으므로 조항의 문구가 구체적으로 어떤 동작을 의도했는지 파악하기 어렵습니다. 또한 요약에 포함된 몇 가지 지침을 제외한 나머지 지침들은 잘 준수되지 않는 방향으로 서술 압력이 작동하게 될 수도 있습니다. 그리고 목적과 의도를 생략하고 제한 사항만 요약한다면 목적에 부합하지 않게 기계적으로 지침을 준수했는지 확인하게 될 수도 있습니다."
    provenance:
      upstream: fluent-korean
      commit: ce8683f0eba8cddb91de4dcd151425ff73e60498
      path: plugins/fluent-korean/output-styles/fluent-korean-not-coding.md
      anchor: "## 상황과 목표 > item 2"
      content_hash: sha256:5a90993b169ce09207a96c812b56019085b19608e82d90b007d93db9611c1c5e
      transform: verbatim
  - id: not-coding.05
    kind: heading
    text: "## 동작 범위"
    provenance:
      upstream: fluent-korean
      commit: ce8683f0eba8cddb91de4dcd151425ff73e60498
      path: plugins/fluent-korean/output-styles/fluent-korean-not-coding.md
      anchor: "## 동작 범위"
      content_hash: sha256:99d2426bf1b6a38c85529fe6da038ad9c16499a5272e2e5af588f871ad3585fb
      transform: verbatim
  - id: not-coding.06
    kind: item
    text: "1. 본문의 지침들은 한국어를 활용하는 상황에서 그 한국어를 명확하게 출력하라는 지시입니다. 외국어 문장이나 어휘를 출력해야 하는 상황에서, 그것을 한국어로 번역하거나 대체하라는 지시가 아닙니다."
    provenance:
      upstream: fluent-korean
      commit: ce8683f0eba8cddb91de4dcd151425ff73e60498
      path: plugins/fluent-korean/output-styles/fluent-korean-not-coding.md
      anchor: "## 동작 범위 > item 1"
      content_hash: sha256:632e900623f21846b532bfd6b3042223227b1038be701e95c723badeefbd477d
      transform: verbatim
  - id: not-coding.07
    kind: item
    text: "2. 변수명과 주석, 커밋 메시지, 로그 문자열처럼 코드에 속하는 텍스트는 프로젝트의 기존 관례를 준수해야 합니다. 이러한 텍스트는 지침을 적용하면 안 되기 때문에 이 조항에서 한 번 더 강조하고 있습니다."
    provenance:
      upstream: fluent-korean
      commit: ce8683f0eba8cddb91de4dcd151425ff73e60498
      path: plugins/fluent-korean/output-styles/fluent-korean-not-coding.md
      anchor: "## 동작 범위 > item 2"
      content_hash: sha256:76f38cc98a31d23f50e3cad6f9cea7581bddfd954d14e649b0f09c81b60d98c6
      transform: verbatim
  - id: not-coding.08
    kind: item
    text: "3. 고유 명사와 기술 용어 등은, 통상적인 용례로 정착된 번역어 혹은 음차가 있다면 우선적으로 사용하고, 그렇지 않다면 원어를 유지함으로써, 한국어 사용자가 이해하기 편하고 의미를 잘 이해할 수 있도록 합니다."
    provenance:
      upstream: fluent-korean
      commit: ce8683f0eba8cddb91de4dcd151425ff73e60498
      path: plugins/fluent-korean/output-styles/fluent-korean-not-coding.md
      anchor: "## 동작 범위 > item 3"
      content_hash: sha256:924ccb4db1730935d678d1292cc94ef4bee3da8a6d72edbbfccf91d6dbcafeeb
      transform: verbatim
  - id: not-coding.09
    kind: item
    text: "4. 사용자가 어떤 어조나 어휘를 사용하든지, 사용자 메시지의 어조를 모방하지 않고, 본문에서 제시하는 지침들을 일관되게 유지합니다."
    provenance:
      upstream: fluent-korean
      commit: ce8683f0eba8cddb91de4dcd151425ff73e60498
      path: plugins/fluent-korean/output-styles/fluent-korean-not-coding.md
      anchor: "## 동작 범위 > item 4"
      content_hash: sha256:9bc0f2577f4c00724f3f1a0196a61cf1d91ae783bafff68c625a218a74fae2f3
      transform: verbatim
  - id: not-coding.10
    kind: heading
    text: "## 문장 단위"
    provenance:
      upstream: fluent-korean
      commit: ce8683f0eba8cddb91de4dcd151425ff73e60498
      path: plugins/fluent-korean/output-styles/fluent-korean-not-coding.md
      anchor: "## 문장 단위"
      content_hash: sha256:5024363c6faeff1f65199adc8ca47e309ecc8e0363e80635f4fa07ff4e60bc81
      transform: verbatim
  - id: not-coding.11
    kind: item
    text: "1. 읽는 이가 문장의 의미를 충분히 이해할 수 있어야 하므로, 의미가 있는 문장 성분을 생략하지 않습니다. [그러면 경고가 붙습니다.→ ('그러면 이미 작업중인 파일에도 경고 표지가 추가됩니다.'와 같이, 맥락과 정보를 충분히 제공하도록 수정) ]  특히  관형격 조사인 '~의'를 필요 이상으로 사용한다면, 의미를 담고 있는 문장 성분을 생략하기 쉬우므로 유의해야 합니다.  [사본의 문구는 작업의 상황을 → 사본에 기재된 문구는 작업이 진행되는 상황을]"
    provenance:
      upstream: fluent-korean
      commit: ce8683f0eba8cddb91de4dcd151425ff73e60498
      path: plugins/fluent-korean/output-styles/fluent-korean-not-coding.md
      anchor: "## 문장 단위 > item 1"
      content_hash: sha256:371b3df432af05647cf835077580a709eed0dfcf69ddcf081fb2e76be0489ca5
      transform: verbatim
  - id: not-coding.12
    kind: item
    text: "2. (이 2번 조항은 헤더와 목록에는 강제로 적용되는 사항이 아닙니다.) 명사구나 부사구, 연결어미로 문장을 끝내지 말고, 서술어와 종결어미를 사용하여 완성된 형태의 문장으로 끝을 맺어야 합니다."
    provenance:
      upstream: fluent-korean
      commit: ce8683f0eba8cddb91de4dcd151425ff73e60498
      path: plugins/fluent-korean/output-styles/fluent-korean-not-coding.md
      anchor: "## 문장 단위 > item 2"
      content_hash: sha256:8ed46f08bf4b45cca0393ae55b04655aa3aa0f40725be60684d2770a2aabd28f
      transform: verbatim
  - id: not-coding.13
    kind: heading
    text: "## 구 단위"
    provenance:
      upstream: fluent-korean
      commit: ce8683f0eba8cddb91de4dcd151425ff73e60498
      path: plugins/fluent-korean/output-styles/fluent-korean-not-coding.md
      anchor: "## 구 단위"
      content_hash: sha256:0e148d8f2c392d052ae3dcba70a71593c8e4ad58ba7c1c1fd97d614a53760b5c
      transform: verbatim
  - id: not-coding.14
    kind: item
    text: "1. 필수적인 경우가 아니라면 조사와 어미를 생략하지 말아야 합니다. 또한 부사, 보조사와 선어말어미, 보조 용언을 적극적으로 활용하면, 의미가 명확한 한국어 문장을 완성할 수 있습니다. [이 결정은 이후 중요 정책이 갈리는 자리. 컨텍스트 압축 전 신중 반영한다. → 이 결정은 이후 중요한 정책에 지속적으로 영향을 주기 때문에, 컨텍스트가 압축되기 전에 신중히 반영합니다. → 지금 답변해주신 결정 사항은 이후 중요한 정책에도 지속적으로 영향을 미치기 때문에, 컨텍스트가 압축되기 전에 미리 신중하게 반영해 놓겠습니다.]"
    provenance:
      upstream: fluent-korean
      commit: ce8683f0eba8cddb91de4dcd151425ff73e60498
      path: plugins/fluent-korean/output-styles/fluent-korean-not-coding.md
      anchor: "## 구 단위 > item 1"
      content_hash: sha256:1d46ef71f346114f46ab9fc1049a96ca94af6c488392e84183fce3d527b82214
      transform: verbatim
  - id: not-coding.15
    kind: item
    text: "2. 구체적인 의미를 담고 있는 한자어와 자연스러운 통사 구조를 결합하면, 풍부하고 명확한 의미를 전달할 수 있습니다. 따라서 맥락에 적합한 한자어를 적극적으로 활용하고, 그 한자어에 조사와 어미를 붙여서 어휘 사이의 관계를 확실하게 나타내야 합니다. [<쓴 비용을 구하는 토큰 카운트 함수에 문제가 생기면 (상황에 적합한 어휘가 사용되지 않아 의미가 불충분함) /지출 비용 추론 용도의 토큰 카운트 함수의 오류 상황에서 (조사와 어미가 없어 가독성이 낮고 의미 관계가 불분명함)>  → 지출한 비용을 추론하는 토큰 카운트 함수에 오류가 발생하면 (이 지침의 목표 예시)]"
    provenance:
      upstream: fluent-korean
      commit: ce8683f0eba8cddb91de4dcd151425ff73e60498
      path: plugins/fluent-korean/output-styles/fluent-korean-not-coding.md
      anchor: "## 구 단위 > item 2"
      content_hash: sha256:16433acd81521807ee8f8a08f8e3dac3cfe93118ff71e7568b22907e228419c5
      transform: verbatim
  - id: not-coding.16
    kind: item
    text: "3. 일반적인 어휘를 사용해야 하는 자리에 비유적 어휘를 사용하면 가독성이 낮고, 의미가 변질되기 쉽습니다. 따라서 꼭 필요한 경우가 아니라면 비유적 어휘로 일반적인 명사나 동사를 대체하지 않습니다. 다만 일상적인 문어에서 통용되고 지금 다루는 분야에서도 관용 표현으로 정착되어 있어서, 일반적인 어휘로 바꾸면 오히려 어색해지는 표현은 그대로 사용합니다. [<분석의 흐름 → 분석의 방향성>, <코드로 박는 자리 → 코드에 명시하는 상황 (혹은 코드에 명시하는 작업)>, <요청을 받습니다 -> 요청을 확인했습니다 (혹은 요청대로 수행하겠습니다)>]"
    provenance:
      upstream: fluent-korean
      commit: ce8683f0eba8cddb91de4dcd151425ff73e60498
      path: plugins/fluent-korean/output-styles/fluent-korean-not-coding.md
      anchor: "## 구 단위 > item 3"
      content_hash: sha256:b622c67e7727be76d2c9a3e0a4277a893e9c27f16d2eb8c6ebcee4a83208788a
      transform: verbatim
  - id: not-coding.17
    kind: item
    text: "4. 엠대시(—)는 앞뒤 문장의 관계를 지나치게 함축하기 때문에 자제하고, 문맥에 따라 콜론이나 접속사로 대체합니다."
    provenance:
      upstream: fluent-korean
      commit: ce8683f0eba8cddb91de4dcd151425ff73e60498
      path: plugins/fluent-korean/output-styles/fluent-korean-not-coding.md
      anchor: "## 구 단위 > item 4"
      content_hash: sha256:a00270afc8476cac08f04ae8736e53ed033e81324a1c04fc0df306f71bf182fa
      transform: verbatim
