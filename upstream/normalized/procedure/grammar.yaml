    blanks: 1
    text: "```markdown\n## 문법 검사 결과\n\n### 발견된 오류 (총 N개)\n\n#### 1. 맞춤법/철자 오류 (N개)\n\n**[위치 또는 원문]**\n- ❌ 틀린 표현: `잘못된 텍스트`\n- ✅ 올바른 표현: `교정된 텍스트`\n- 📝 설명: [오류 이유와 규칙 설명]\n- 🔍 확신도: 확실한 오류 / 권장 사항 / 제안\n\n#### 2. 띄어쓰기 오류 (N개)\n\n[위와 동일한 형식]\n\n#### 3. 문법 구조 오류 (N개)\n\n[위와 동일한 형식]\n\n#### 4. 구두점 오류 (N개)\n\n[위와 동일한 형식]\n\n---\n\n## 교정된 텍스트\n\n[전체 교정된 버전을 제공]\n\n---\n\n## 요약\n\n- 총 오류 수: N개\n- 맞춤법/철자: N개\n- 띄어쓰기: N개\n- 문법 구조: N개\n- 구두점: N개\n```"
    provenance:
      upstream: korean-skills
      commit: ae12ba27982ebeff03b46dc738365aaa34260d9a
