  - id: diagnose.044
    kind: paragraph
    text: "**유창성 함정(fluency trap) — 가장 중요한 원칙.** 매끄럽고 규범에 맞고 구조가 완결된 글일수록\n사람이 쓴 것처럼 *느껴지지만*, LLM 글은 바로 그 형식 차원(특히 **조직**)에서 사람만큼/더 높은 점수를 받는다.\nLREAD 연구에서 사람이 직관만으로 판별하면 정확도 60%·일치도 κ −0.09(우연 수준)에 그쳤고, LLM을\n사람으로 오판하는 false-negative가 많았다. 따라서:"
    provenance:
      upstream: yoonmoon
      commit: c88853106c8fa8448447136f5aa3fc8bb9650303
      path: skills/detect/SKILL.md
      anchor: "fluencytrap > bold label **유창성 함정(fluency trap) — 가장 중요한 원칙.**"
      content_hash: sha256:eb9d6a5192e9f45da51500b55dcfb8e8011cc7c5b8e17a254fab64ec7a62e9e1
      transform: verbatim
