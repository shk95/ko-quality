    text: "**챗봇 잔재 위생 (v2.6)**: 저장 전에 챗봇 프레임 문장이 섞여 있으면 벗겨낸다 — 머리(\"물론입니다!\", \"다음은 ~입니다:\", \"요청하신 내용을 정리하면\"), 꼬리(\"도움이 되셨길 바랍니다\", \"추가 질문이 있으시면\"), 지식 한계 면책(\"제 지식은 ~까지입니다\"). 실사용자는 챗봇 출력을 그대로 붙여넣는 일이 많고, 이 문장들은 본문이 아니므로 제거해도 의미 손실이 0이다. 본문 안에 자연스럽게 녹아 있는 유사 표현은 건드리지 않는다."
