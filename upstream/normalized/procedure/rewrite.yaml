    text: "**서법 보존 (v2.4, 필수):** 당위·요구(\"~해야 한다\")를 사실 단정(\"~한다\")으로, 추측·유보(\"~일 수 있다\")를 단정으로 바꾸지 않는다. 주장의 강도와 성격은 그대로 둔다. 단 서법의 '보존'과 그 표지의 '반복'은 다른 문제이므로, 표지가 반복돼 리듬을 지배하면 서법을 유지한 채 배치만 바꾼다(I-4)."
