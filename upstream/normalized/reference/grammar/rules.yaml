      content_hash: sha256:92dd1076786febb8d7f79a750e736c555bc951e566dde6db548f523afd1303af
      transform: verbatim
  - id: rules.158
    kind: paragraph
    blanks: 1
    text: "**근거**: 한글 맞춤법 부록 「문장 부호」(국립국어원). 가운뎃점은 서양 문장 부호에는 없는 한국어 고유의 부호로, **단순 열거가 아니라 \"짝을 이루거나 한 묶음으로 묶이는\" 어구**를 표시합니다."
    provenance:
      upstream: korean-skills
      commit: ae12ba27982ebeff03b46dc738365aaa34260d9a
      path: skills/grammar-checker/references/rules.md
      anchor: "### 6. 가운뎃점(·) > bold label **근거**"
      content_hash: sha256:86eca8770df9aa84946311ebc7b0da4d114ffb39b4814957d9ba1a1f675635b6
      transform: verbatim
  - id: rules.159
    kind: paragraph
    blanks: 1
    text: "**사용 시점** (3가지 용법):"
    provenance:
      upstream: korean-skills
      commit: ae12ba27982ebeff03b46dc738365aaa34260d9a
      path: skills/grammar-checker/references/rules.md
      anchor: "### 6. 가운뎃점(·) > bold label **사용 시점**"
      content_hash: sha256:79d79d48deceba39cd55cbddace99b48abbab49278018ace606716d72efa687a
      transform: verbatim
  - id: rules.160
    kind: item
    blanks: 1
    text: "1. **짝을 이루는 어구·공통 성분 축약**: 두 항목이 한 쌍을 이루거나, 공통되는 부분(접미사·접두사)을 줄여서 묶을 때\n   - 예: `금·은·동메달` (공통 성분 `메달` 축약)\n   - 예: `시·도지사` (공통 성분 `지사` 축약)\n   - 예: `한·미 정상회담` (한국과 미국이 짝)"
    provenance:
      upstream: korean-skills
      commit: ae12ba27982ebeff03b46dc738365aaa34260d9a
      path: skills/grammar-checker/references/rules.md
      anchor: "### 6. 가운뎃점(·) > item **짝을 이루는 어구·공통 성분 축약**"
      content_hash: sha256:8f3bd0b30fcf319b6a7f117dd03be119a58f92d11c504e0f10579233e597ac05
      transform: verbatim
  - id: rules.161
    kind: item
    blanks: 1
    text: "2. **같은 묶음 안의 항목 표시**: 일정 기준으로 묶었을 때, 묶음 안의 항목 사이\n   - 예: `상·중·하위권`\n   - 예: `읽기·쓰기 권한`"
    provenance:
      upstream: korean-skills
      commit: ae12ba27982ebeff03b46dc738365aaa34260d9a
      path: skills/grammar-checker/references/rules.md
      anchor: "### 6. 가운뎃점(·) > item **같은 묶음 안의 항목 표시**"
      content_hash: sha256:3a91dcb818ccca74082ed29c5da118e1c9b86dfaa53c96884a9887e8b5e3e6f6
      transform: verbatim
  - id: rules.162
    kind: item
    blanks: 1
    text: "3. **특정 의미가 있는 날짜**: 역사적 사건이나 약식 날짜 표기\n   - 예: `3·1 운동`, `8·15 광복`\n   - 예: `2026·4·26` (마침표 대신 허용)"
    provenance:
      upstream: korean-skills
      commit: ae12ba27982ebeff03b46dc738365aaa34260d9a
      path: skills/grammar-checker/references/rules.md
      anchor: "### 6. 가운뎃점(·) > item **특정 의미가 있는 날짜**"
      content_hash: sha256:2b82f488ff0b5b14a94d498f222ad9abed3f4ade344157d40b878feef4491611
