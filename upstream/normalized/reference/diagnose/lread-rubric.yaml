      path: skills/detect/references/lread-rubric.md
      anchor: "# 학술 근거 — LREAD 루브릭 (사람의 한국어 AI 글 판별)"
      content_hash: sha256:b62efbbe2f8b0703679447d55cf28946edbf1a03858528b2aa1c7d061f6995ae
      transform: verbatim
  - id: lread-rubric.001
    kind: paragraph
    text: "윤문 탐지(detect)의 판정 절차는 **LREAD 루브릭**으로 보강된다. LREAD는 사람이 한국어 LLM 글을\n\"기준에 따라\" 판별하도록 만든 루브릭으로, 직관만으로는 놓치는 미시 단서를 표면화한다."
    provenance:
      upstream: yoonmoon
      commit: c88853106c8fa8448447136f5aa3fc8bb9650303
      path: skills/detect/references/lread-rubric.md
      anchor: "# 학술 근거 — LREAD 루브릭 (사람의 한국어 AI 글 판별) > paragraph 1"
      content_hash: sha256:e48f87a6ac450edd9453c329ebb6afa44285af79ff34aec91327ded1dc74424b
      transform: verbatim
  - id: lread-rubric.002
    kind: heading
    text: "## 출처"
    provenance:
      upstream: yoonmoon
      commit: c88853106c8fa8448447136f5aa3fc8bb9650303
      path: skills/detect/references/lread-rubric.md
      anchor: "## 출처"
      content_hash: sha256:a0c17e03e435692dc252647873f9ea3a50b4fd51e64e2aed9ffb0d7382e4afd0
      transform: verbatim
  - id: lread-rubric.003
    kind: quote
    text: "> **From Intuition to Calibrated Judgment: A Rubric-Based Expert-Panel Study of Human Detection of\n> LLM-Generated Korean Text.** Shinwoo Park, Yo-Sub Han (Yonsei). arXiv:2601.19913 (2026, preprint).\n> https://arxiv.org/abs/2601.19913 · 루브릭·데이터 https://github.com/Shinwoo-Park/lread\n> KatFishNet(ACL 2025)과 동일 연구진. confidence: HIGH — arXiv `2601.19913`(v1~v3)·GitHub\n> `Shinwoo-Park/lread` 실재 검증(2026-06). 제목·핵심 수치(정확도 0.60→0.90, κ −0.09→0.24→0.82)·\n> 루브릭 배점(100점=내용40·조직10·표현50)을 본문과 대조 확인. preprint 주의."
    provenance:
      upstream: yoonmoon
      commit: c88853106c8fa8448447136f5aa3fc8bb9650303
      path: skills/detect/references/lread-rubric.md
      anchor: "## 출처 > quote 1"
      content_hash: sha256:4789abc4137d5f5e75626454676b994ef89a27b1fe550067896c6b7457b6d8c4
      transform: verbatim
  - id: lread-rubric.004
    kind: heading
    text: "## 핵심 발견 — fluency trap (유창성 함정)"
    provenance:
      upstream: yoonmoon
      commit: c88853106c8fa8448447136f5aa3fc8bb9650303
      path: skills/detect/references/lread-rubric.md
      anchor: "## 핵심 발견 — fluency trap (유창성 함정)"
      content_hash: sha256:f925c7552f4daf515c811a88525b5ea3828d765f4e80b8979c8b95be5f82b6b0
      transform: verbatim
  - id: lread-rubric.005
    kind: item
    text: "- 사람의 **직관만** 판별: 다수결 정확도 60%, 평가자 일치도 Fleiss κ −0.09(우연 수준). **루브릭 적용 후**\n  일치도 κ 0.24→0.82로 급상승, 오탐(특히 LLM을 사람으로 오판하는 false-negative) 급감."
    provenance:
      upstream: yoonmoon
      commit: c88853106c8fa8448447136f5aa3fc8bb9650303
      path: skills/detect/references/lread-rubric.md
      anchor: "## 핵심 발견 — fluency trap (유창성 함정) > item 1"
      content_hash: sha256:2dade2bfb6f4896b277dd44a63465df292c250b2d18bbc4b87124949f5eb3349
      transform: verbatim
  - id: lread-rubric.006
    kind: item
    text: "- **표면적 매끄러움·규범 준수·구조 완결성은 \"사람이 썼다\"는 증거가 아니다.** LLM 글은 형식 차원,\n  특히 **조직(Organization)** 에서 사람과 비슷하거나 더 높은 점수를 받는다(템플릿 충실·구조 완결)."
    provenance:
      upstream: yoonmoon
      commit: c88853106c8fa8448447136f5aa3fc8bb9650303
      path: skills/detect/references/lread-rubric.md
      anchor: "## 핵심 발견 — fluency trap (유창성 함정) > item **표면적 매끄러움·규범 준수·구조 완결성은 \"사람이 썼다\"는 증거가 아니다.**"
      content_hash: sha256:a597f8f191c762a124939538072b30646e287844262d4a53fc3b402d8355752c
      transform: verbatim
  - id: lread-rubric.007
    kind: item
    text: "- 진짜 판별력은 **표현(Expression)**(과도한 규범화, register 안정성의 부자연스러운 과잉, 번역투)과\n  **내용(Content)**(창의성, 발달 수준에 맞는 비정형성)에 있다."
    provenance:
      upstream: yoonmoon
      commit: c88853106c8fa8448447136f5aa3fc8bb9650303
      path: skills/detect/references/lread-rubric.md
      anchor: "## 핵심 발견 — fluency trap (유창성 함정) > item 3"
      content_hash: sha256:bd41e7c50fadc251aa1a48176842431873a8ff14e58eefbe89f44e12d3475f1d
      transform: verbatim
  - id: lread-rubric.008
    kind: item
    text: "- 루브릭은 주의를 *전역적 유창성*에서 **띄어쓰기·구두점·register·페르소나 충실도** 같은 안정적 단서로 돌린다."
    provenance:
      upstream: yoonmoon
      commit: c88853106c8fa8448447136f5aa3fc8bb9650303
      path: skills/detect/references/lread-rubric.md
      anchor: "## 핵심 발견 — fluency trap (유창성 함정) > item 4"
