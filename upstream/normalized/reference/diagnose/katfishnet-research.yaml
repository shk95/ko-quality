      transform: verbatim
  - id: katfishnet-research.003
    kind: quote
    blanks: 1
    text: "> **KatFishNet: Detecting LLM-Generated Korean Text through Linguistic Feature Analysis**\n> Shinwoo Park, Shubin Kim, Do-Kyung Kim, Yo-Sub Han.\n> _Proceedings of the 63rd Annual Meeting of the ACL (Volume 1: Long Papers)_, 2025, pp. 21189–21222.\n> ACL Anthology: https://aclanthology.org/2025.acl-long.1030/ · DOI: 10.18653/v1/2025.acl-long.1030\n> 코드·데이터(KatFish 벤치마크): https://github.com/Shinwoo-Park/katfishnet"
    provenance:
      upstream: yoonmoon
      commit: c88853106c8fa8448447136f5aa3fc8bb9650303
      path: skills/humanize/references/katfishnet-research.md
      anchor: "## 출처 > quote 1"
      content_hash: sha256:2a5628e373875da5cc39adfed9cf8dd960987f2688ecb8643276d2a8ba2fdeae
      transform: verbatim
  - id: katfishnet-research.004
    kind: paragraph
    blanks: 1
    text: "논문은 인간 작성 vs LLM 생성 한국어 텍스트를 **에세이·시·논문 초록** 세 장르에서 비교하고,\n세 가지 언어 특징군으로 둘을 구분한다. 핵심 결론: **쉼표(구두점) 기반 특징이 가장 강력한 판별자**로,\n에세이에서 평균 AUC-ROC **94.88%**, 기존 최고 기법 대비 평균 **+19.78%p**."
    provenance:
      upstream: yoonmoon
      commit: c88853106c8fa8448447136f5aa3fc8bb9650303
      path: skills/humanize/references/katfishnet-research.md
      anchor: "## 출처 > paragraph 1"
      content_hash: sha256:ce4ab8cda49b5419092df3b1b2a1c5f449764d5db9c396f3cf925028af655c6f
      transform: verbatim
