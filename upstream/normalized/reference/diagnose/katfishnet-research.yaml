  - id: katfishnet-research.006
    kind: heading
    blanks: 1
    text: "### 1) 띄어쓰기 패턴 (Word Spacing)"
    provenance:
      upstream: yoonmoon
      commit: c88853106c8fa8448447136f5aa3fc8bb9650303
      path: skills/humanize/references/katfishnet-research.md
      anchor: "### 1) 띄어쓰기 패턴 (Word Spacing)"
      content_hash: sha256:6a9bdcc402ccbf85ca0b771af56acedc9d8a73c8b5729e99fda3b69879f4d3f9
      transform: verbatim
  - id: katfishnet-research.007
    kind: item
    blanks: 1
    text: "- **의존명사(BN)·보조용언(VX)** 주변 띄어쓰기 분포를 분석. (MMN-BN Space Ratio, BN Space Ratio)"
    provenance:
      upstream: yoonmoon
      commit: c88853106c8fa8448447136f5aa3fc8bb9650303
      path: skills/humanize/references/katfishnet-research.md
      anchor: "### 1) 띄어쓰기 패턴 (Word Spacing) > item **의존명사(BN)·보조용언(VX)**"
      content_hash: sha256:cbd4b959e88e517f11615480957e6157ffc8f5619333d9991a13a21998374497
      transform: verbatim
  - id: katfishnet-research.008
    kind: item
    blanks: 0
    text: "- LLM 텍스트는 표준 띄어쓰기 규칙을 더 기계적·균일하게 따르는 경향. 사람 글은 변이가 크다."
    provenance:
      upstream: yoonmoon
      commit: c88853106c8fa8448447136f5aa3fc8bb9650303
      path: skills/humanize/references/katfishnet-research.md
      anchor: "### 1) 띄어쓰기 패턴 (Word Spacing) > item 2"
      content_hash: sha256:a648b0e55216f9ec5b74f131d8910048550ac8009bcbe48d56da3d8fa4ec88c2
      transform: verbatim
  - id: katfishnet-research.009
    kind: item
    blanks: 0
    text: "- **윤문에서의 활용**: 주로 *탐지 신호*다. 윤문은 띄어쓰기를 함부로 바꾸지 않는다(맞춤법 교정은 범위 밖).\n  다만 \"할 수 있다 / 하는 것 / 것이다\"처럼 의존명사·보조용언이 기계적으로 반복되는 정황은\n  → **카테고리 6(형식명사·명사화)** 신호로 본다."
    provenance:
      upstream: yoonmoon
      commit: c88853106c8fa8448447136f5aa3fc8bb9650303
      path: skills/humanize/references/katfishnet-research.md
      anchor: "### 1) 띄어쓰기 패턴 (Word Spacing) > item **윤문에서의 활용**"
      content_hash: sha256:9c3085bf682f3a059db76693d76e2cf7e8ea5d0e4b9b2c0fe6304108159f9d96
      transform: verbatim
  - id: katfishnet-research.010
    kind: heading
    blanks: 1
    text: "### 2) POS n-gram 다양성 (POS N-gram Diversity)"
    provenance:
      upstream: yoonmoon
      commit: c88853106c8fa8448447136f5aa3fc8bb9650303
      path: skills/humanize/references/katfishnet-research.md
      anchor: "### 2) POS n-gram 다양성 (POS N-gram Diversity)"
      content_hash: sha256:9719a0719519db9ccf68631a8311ac034543ec9dc3a8baa585399e326bab15aa
      transform: verbatim
  - id: katfishnet-research.011
    kind: item
    blanks: 1
    text: "- 품사 n-gram(uni~penta)의 다양성을 측정. **사람 글은 통사 구조가 풍부**하고, LLM은 흔한 구조를 반복한다."
    provenance:
      upstream: yoonmoon
      commit: c88853106c8fa8448447136f5aa3fc8bb9650303
      path: skills/humanize/references/katfishnet-research.md
      anchor: "### 2) POS n-gram 다양성 (POS N-gram Diversity) > item 1"
      content_hash: sha256:f63509fba1a728bb5b60ed6c8d8e898eec6f19e3ab33fede521f07bf4130a1bd
      transform: verbatim
  - id: katfishnet-research.012
    kind: item
    blanks: 0
    text: "- **윤문에서의 활용**: → **카테고리 9(리듬 균일성)** 의 핵심 근거. 종결어미·문장 구조·문두가 단조롭게\n  반복되면 AI 티다. 윤문은 의미를 바꾸지 않는 선에서 구조·종결을 변주해 다양성을 회복한다."
    provenance:
      upstream: yoonmoon
      commit: c88853106c8fa8448447136f5aa3fc8bb9650303
      path: skills/humanize/references/katfishnet-research.md
      anchor: "### 2) POS n-gram 다양성 (POS N-gram Diversity) > item **윤문에서의 활용**"
      content_hash: sha256:b67a097681089e563289ce6af334949f98c07f421a8003661e24571bb26e5fff
      transform: verbatim
  - id: katfishnet-research.013
    kind: heading
    blanks: 1
    text: "### 3) 쉼표 사용 패턴 (Comma Usage) ★ 가장 강력"
    provenance:
      upstream: yoonmoon
      commit: c88853106c8fa8448447136f5aa3fc8bb9650303
      path: skills/humanize/references/katfishnet-research.md
      anchor: "### 3) 쉼표 사용 패턴 (Comma Usage) ★ 가장 강력"
      content_hash: sha256:3b5d7603354e5df29f3f452293f8255fe0abcb0587a4e6cdc147aae12c6d6ec5
      transform: verbatim
  - id: katfishnet-research.014
    kind: item
    blanks: 1
    text: "- 쉼표의 **빈도·상대 위치·쉼표 앞뒤 품사 조합 다양성**을 분석.\n  (Comma Inclusion Rate, Average Comma Usage Rate, Relative Position of Comma, POS Diversity around comma)"
    provenance:
      upstream: yoonmoon
      commit: c88853106c8fa8448447136f5aa3fc8bb9650303
      path: skills/humanize/references/katfishnet-research.md
      anchor: "### 3) 쉼표 사용 패턴 (Comma Usage) ★ 가장 강력 > item 1"
      content_hash: sha256:77b77f730f1583fa7f78f8e8617b50058ec18fed2831ab9d230da0ec591c067f
      transform: verbatim
  - id: katfishnet-research.015
    kind: item
    blanks: 0
    text: "- 한국어는 본래 영어보다 쉼표를 **덜** 쓴다. 그런데 LLM 생성 한국어는 영어 영향으로 **쉼표를 과용**한다.\n  특히 연결어미·접속부사 뒤에 습관적으로 쉼표를 찍는다."
    provenance:
      upstream: yoonmoon
      commit: c88853106c8fa8448447136f5aa3fc8bb9650303
      path: skills/humanize/references/katfishnet-research.md
      anchor: "### 3) 쉼표 사용 패턴 (Comma Usage) ★ 가장 강력 > item 2"
      content_hash: sha256:04b71705a7036c38c76e28db6e84fda72844dd3a755bf22708c0dec6d3abf067
      transform: verbatim
  - id: katfishnet-research.016
    kind: item
    blanks: 0
    text: "- **윤문에서의 활용**: → **카테고리 4(접속사·연결어 남발)** 의 \"연결어미 뒤 불필요한 쉼표\"를 심각도 **강**으로\n  두는 직접 근거. \"그리고, / 하지만, / 또한, / 즉,\" 같은 패턴을 우선 제거한다."
    provenance:
      upstream: yoonmoon
      commit: c88853106c8fa8448447136f5aa3fc8bb9650303
      path: skills/humanize/references/katfishnet-research.md
      anchor: "### 3) 쉼표 사용 패턴 (Comma Usage) ★ 가장 강력 > item **윤문에서의 활용**"
