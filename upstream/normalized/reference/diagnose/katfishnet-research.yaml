    text: "# 학술 근거 — KatFishNet (ACL 2025)"
    provenance:
      upstream: yoonmoon
      commit: c88853106c8fa8448447136f5aa3fc8bb9650303
      path: skills/humanize/references/katfishnet-research.md
      anchor: "# 학술 근거 — KatFishNet (ACL 2025)"
      content_hash: sha256:8850a39278a8c0d4b4a010a2aff2bdd5ad26bc20f1f582542872f229bc8a2016
      transform: verbatim
  - id: katfishnet-research.001
    kind: paragraph
    blanks: 1
    text: "윤문의 AI 티 탐지 기준 일부는 한국어 LLM 텍스트 탐지 연구로 뒷받침된다. 그중 가장 직접적인 근거가\n**KatFishNet** 논문이다. 이 문서는 논문의 핵심 발견을 정리하고, 윤문의 어떤 카테고리에 어떻게\n반영되는지 매핑한다."
    provenance:
      upstream: yoonmoon
      commit: c88853106c8fa8448447136f5aa3fc8bb9650303
      path: skills/humanize/references/katfishnet-research.md
      anchor: "# 학술 근거 — KatFishNet (ACL 2025) > paragraph 1"
      content_hash: sha256:2774ff3971cfb18302ad97ea01964094d5b19e8b1ac0c6e84a74eac8ca72f382
      transform: verbatim
  - id: katfishnet-research.002
    kind: heading
    blanks: 1
    text: "## 출처"
    provenance:
      upstream: yoonmoon
      commit: c88853106c8fa8448447136f5aa3fc8bb9650303
      path: skills/humanize/references/katfishnet-research.md
