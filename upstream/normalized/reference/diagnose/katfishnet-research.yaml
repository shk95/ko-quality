  - id: katfishnet-research.024
    kind: paragraph
    blanks: 1
    text: "KatFishNet은 **탐지(detection)** 연구다. 윤문의 목적은 탐지기를 속이는 것이 아니라, **한국어다운 자연스러운\n글로 다듬는 것**이다. 같은 언어 특징을 참고하지만 방향이 다르다: 연구는 \"무엇이 LLM 티인가\"를 밝히고,\n윤문은 \"그 티를 의미를 해치지 않고 어떻게 자연스럽게 고치는가\"에 집중한다. 수치·인용·주장 등 내용은\n언제나 보존한다([`ai-tell-taxonomy.md`](ai-tell-taxonomy.md)의 보존 원칙 참조)."
    provenance:
      upstream: yoonmoon
      commit: c88853106c8fa8448447136f5aa3fc8bb9650303
      path: skills/humanize/references/katfishnet-research.md
      anchor: "## 주의 — 윤문은 \"탐지 우회\" 도구가 아니다 > paragraph 1"
      content_hash: sha256:22f32465d18100f226691c80ff37e2dd1836c1bf2a5cfe7e58ed0eef3ffa80e1
      transform: verbatim
