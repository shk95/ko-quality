fragments:
  - id: xdac-research.000
    kind: heading
    text: "# 학술 근거 — XDAC (단문/SNS·댓글 AI 탐지, ACL 2025)"
    provenance:
      upstream: yoonmoon
      commit: c88853106c8fa8448447136f5aa3fc8bb9650303
      path: skills/detect/references/xdac-research.md
      anchor: "# 학술 근거 — XDAC (단문/SNS·댓글 AI 탐지, ACL 2025)"
      content_hash: sha256:1c87b4bb0079486adfe712d3f484917ac6baeb0fd90d213a1756bf6b77c1953e
      transform: verbatim
  - id: xdac-research.001
    kind: paragraph
    text: "`detect`는 문어체(KatFishNet)·사람 판별 루브릭(LREAD) 중심이다. **단문·구어체(SNS·댓글·채팅)** 는 신호\n방향이 달라, 한국어 댓글 AI 탐지 연구 **XDAC**로 별도 보강한다. 이 문서는 XDAC 본문 검증 결과와 단문 신호,\n그리고 detect 스킬에 'SNS/댓글 톤' 축을 더할 때의 조건을 정리한다."
    provenance:
      upstream: yoonmoon
      commit: c88853106c8fa8448447136f5aa3fc8bb9650303
      path: skills/detect/references/xdac-research.md
      anchor: "# 학술 근거 — XDAC (단문/SNS·댓글 AI 탐지, ACL 2025) > paragraph 1"
      content_hash: sha256:e2470a4ff0b9f59c17c582a004511bb5c41053fa9a4b00c694e69d528eb952eb
      transform: verbatim
  - id: xdac-research.002
    kind: heading
    text: "## 출처 (confidence: HIGH — ACL Anthology PDF 본문 대조)"
    provenance:
      upstream: yoonmoon
      commit: c88853106c8fa8448447136f5aa3fc8bb9650303
      path: skills/detect/references/xdac-research.md
      anchor: "## 출처 (confidence: HIGH — ACL Anthology PDF 본문 대조)"
      content_hash: sha256:240ab9f7ae6bbb4d6f573b8ec797a1200da820fe0824637e44d2b7227b6d3c2c
      transform: verbatim
  - id: xdac-research.003
    kind: quote
    text: "> **XDAC: XAI-Driven Detection and Attribution of LLM-Generated News Comments in Korean.**\n> Wooyoung Go(NSRI/KAIST), Hyoungshick Kim(Sungkyunkwan), Alice Oh(KAIST), Yongdae Kim(KAIST).\n> _Proceedings of the 63rd Annual Meeting of the ACL (Vol. 1: Long Papers)_, 2025, pp. 22737–22747.\n> ACL Anthology: https://aclanthology.org/2025.acl-long.1108/ · code: https://github.com/airobotlab/XDAC"
    provenance:
      upstream: yoonmoon
      commit: c88853106c8fa8448447136f5aa3fc8bb9650303
      path: skills/detect/references/xdac-research.md
      anchor: "## 출처 (confidence: HIGH — ACL Anthology PDF 본문 대조) > quote 1"
      content_hash: sha256:142ad5773e1a36915f4f2c5d7f64ed8583778efa8ee430562e234a33c8a508a0
      transform: verbatim
  - id: xdac-research.004
    kind: item
    text: "- **과제**: 한국어 뉴스 **댓글(평균 51자 / 11단어)** 의 LLM 생성 여부 탐지(Detection) + 어떤 모델인지 귀속(Attribution)."
    provenance:
      upstream: yoonmoon
      commit: c88853106c8fa8448447136f5aa3fc8bb9650303
      path: skills/detect/references/xdac-research.md
      anchor: "## 출처 (confidence: HIGH — ACL Anthology PDF 본문 대조) > item **과제**"
      content_hash: sha256:2251ffc5db77d24edd58d23846ae9f76c05bccb55f79b8d2a1574c84346cd39d
      transform: verbatim
  - id: xdac-research.005
    kind: item
    text: "- **데이터**: HWC 1.3M(실제 한국어 뉴스 댓글) + LGC 1M(14개 모델 생성). 실세계 분석에서 네이버 댓글 5.24M 중 27,029건을 잠재 LGC로 식별."
    provenance:
      upstream: yoonmoon
      commit: c88853106c8fa8448447136f5aa3fc8bb9650303
      path: skills/detect/references/xdac-research.md
      anchor: "## 출처 (confidence: HIGH — ACL Anthology PDF 본문 대조) > item **데이터**"
      content_hash: sha256:61b3cf1289a760a243eff9d6954ca6cfb731808c49fbad1bd3ed39f3d2c182be
      transform: verbatim
  - id: xdac-research.006
    kind: item
    text: "- **성능**: **Detection F1 98.5%**(GPTZero가 짧은 댓글서 F1 41.7%로 무력한 것과 대비), Attribution F1 84.3%."
    provenance:
      upstream: yoonmoon
      commit: c88853106c8fa8448447136f5aa3fc8bb9650303
      path: skills/detect/references/xdac-research.md
      anchor: "## 출처 (confidence: HIGH — ACL Anthology PDF 본문 대조) > item **성능**"
      content_hash: sha256:5d08b5c717115724e41c2d077db2fede29a34c88c0a8df52477cf1360de61d3a
      transform: verbatim
  - id: xdac-research.007
    kind: item
    text: "- **방법**: KcBERT 파인튜닝 + XAI(Guided Grad-CAM·Captum). 토크나이저에 포맷팅 토큰(`<SPACE>/<ENTER>/<TAB>`)·\n  반복 인코딩(`<REP>ㅋ5</REP>`)·tone/특수문자 토큰 추가."
    provenance:
      upstream: yoonmoon
      commit: c88853106c8fa8448447136f5aa3fc8bb9650303
      path: skills/detect/references/xdac-research.md
      anchor: "## 출처 (confidence: HIGH — ACL Anthology PDF 본문 대조) > item **방법**"
      content_hash: sha256:ad7d7a5d717042899fa8d5d30e79652a297a9a0c514e05463663dd603b63127e
      transform: verbatim
