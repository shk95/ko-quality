  - id: xdac-research.020
    kind: heading
    text: "## ⚠️ \"이모지=사람\" 단정 금지 (정정)"
    provenance:
      upstream: yoonmoon
      commit: c88853106c8fa8448447136f5aa3fc8bb9650303
      path: skills/detect/references/xdac-research.md
      anchor: "## ⚠️ \"이모지=사람\" 단정 금지 (정정)"
      content_hash: sha256:722c7728979f787f17938c331d9492f8e7c875942dce97929f3950c5f2cace8d
      transform: verbatim
  - id: xdac-research.021
    kind: paragraph
    text: "XDAC는 이모지를 사람 신호로 단순화하지 **않는다**. LGC가 이모지를 넣어도 \"전세계 공통 표준 기호에만 의존하는\n**표준화된 패턴**\"을 보인다(Fig 2). 즉 신호는 **이모지 유무가 아니라 사용의 다양성/표준화 정도**다. \"이모지 있으면\n사람\"으로 판정하면 위양성이 난다."
    provenance:
      upstream: yoonmoon
      commit: c88853106c8fa8448447136f5aa3fc8bb9650303
      path: skills/detect/references/xdac-research.md
      anchor: "## ⚠️ \"이모지=사람\" 단정 금지 (정정) > paragraph 1"
      content_hash: sha256:fac1253d09fedec5f1d23d73e2234396a41d250da3ffcfd1556ddbbbb028e953
      transform: verbatim
  - id: xdac-research.022
    kind: heading
    text: "## detect 스킬 'SNS/댓글 톤' 축 — 조건부 권고"
    provenance:
      upstream: yoonmoon
      commit: c88853106c8fa8448447136f5aa3fc8bb9650303
      path: skills/detect/references/xdac-research.md
      anchor: "## detect 스킬 'SNS/댓글 톤' 축 — 조건부 권고"
      content_hash: sha256:89007639e895368a3ac9d11add8c60931a245c86947179f3e49078efaee5fd2c
      transform: verbatim
  - id: xdac-research.023
    kind: paragraph
    text: "KcBERT 가중치를 직접 못 쓰므로 규칙형 신호로 전환해 **보조 축**으로 추가한다. 단 아래 조건 필수:"
    provenance:
      upstream: yoonmoon
      commit: c88853106c8fa8448447136f5aa3fc8bb9650303
      path: skills/detect/references/xdac-research.md
      anchor: "## detect 스킬 'SNS/댓글 톤' 축 — 조건부 권고 > paragraph 1"
      content_hash: sha256:58a204d6d1608f93a89aa6c6108754566de9bbf63e98527b16d3c2e142044284
      transform: verbatim
  - id: xdac-research.024
    kind: item
    text: "1. **장르 게이트(필수)** — 이 축은 **SNS·댓글·채팅 등 단문 구어체에만** 적용. 블로그·리포트·공식문서(문어체)에\n   \"반복문자 없으니 AI\"를 적용하면 100% 위양성. 입력이 단문·비격식일 때만 활성화한다."
    provenance:
      upstream: yoonmoon
      commit: c88853106c8fa8448447136f5aa3fc8bb9650303
      path: skills/detect/references/xdac-research.md
      anchor: "## detect 스킬 'SNS/댓글 톤' 축 — 조건부 권고 > item **장르 게이트(필수)**"
      content_hash: sha256:b579091507d269b955f3f6c31517591cb893c3bdbfd2171783f94d1aaa067aac
      transform: verbatim
  - id: xdac-research.025
    kind: item
    text: "2. **다축 합산만** — 개별 신호는 약하다(사람도 격식 댓글을 쓰고, LGC도 11.61%는 반복문자가 있음). 단일 신호로 단정 금지."
    provenance:
      upstream: yoonmoon
      commit: c88853106c8fa8448447136f5aa3fc8bb9650303
      path: skills/detect/references/xdac-research.md
      anchor: "## detect 스킬 'SNS/댓글 톤' 축 — 조건부 권고 > item **다축 합산만**"
      content_hash: sha256:c4ca81aff51de5f77c1be2e4beaffe5be2fc38e1b5b2cebea1c3776d58a13565
      transform: verbatim
  - id: xdac-research.026
    kind: item
    text: "3. **카테고리 8과 신호 방향이 반대** — 카테고리 8(시각 장식)은 문어체에서 **이모지·장식 과잉 = AI**다. 그러나 단문에서는\n   **포맷팅·반복문자 결핍 = AI**다. 같은 표면 요소가 장르에 따라 정반대 신호이므로, 단문 축은 카테고리 8의 **형제/하위\n   노드**로 두되 방향을 분리 표기한다."
    provenance:
      upstream: yoonmoon
      commit: c88853106c8fa8448447136f5aa3fc8bb9650303
      path: skills/detect/references/xdac-research.md
      anchor: "## detect 스킬 'SNS/댓글 톤' 축 — 조건부 권고 > item **카테고리 8과 신호 방향이 반대**"
      content_hash: sha256:8b2d184b824138f02024fd8adce69701efb22bc58426e1757e5a607a7980ada8
      transform: verbatim
  - id: xdac-research.027
    kind: paragraph
    text: "넣을 신호(강→약): ① 반복문자 부재(구어 맥락인데 ㅋㅋ/ㅎㅎ 전무) ② 줄바꿈·이중공백 부재 ③ 격식·헤지 정형구 과다·\n중립 어조 ④ 길이 일관성 ⑤ 이모지/특수문자의 획일성(유무 아님)."
    provenance:
      upstream: yoonmoon
      commit: c88853106c8fa8448447136f5aa3fc8bb9650303
