# assemble/agents/editor.yaml — 06 §8
name: korean-editor
role: 산출물을 윤문하고 문법을 교정한다
description: "Edits Korean text: removes AI-writing tells with ko-rewrite, then corrects grammar with ko-grammar, keeping the content. Use when Korean text should be polished and corrected in one pass."
preset: edit
tools: [Read, Grep, Glob, Skill, Write, Edit]
prompt:
  compose: [profile.policy, profile.blocks]
  append: "Run the ko-rewrite skill on the text you are given, then the ko-grammar skill on its result. Keep the content. Return the edited text, then each skill's report."
