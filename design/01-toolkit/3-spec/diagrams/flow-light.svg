<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 580" width="1080" height="580" role="img" aria-label="사용자 지시가 시스템 프롬프트 층의 정책, 메인 에이전트, 스킬 파일, 정책이 포함된 서브에이전트를 거쳐 응답으로 나가고, hook 로거가 그 과정을 하네스 밖에 기록하는 흐름">
<style>
text{font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
.box{fill:#FFFFFF;stroke:#1B2028;stroke-width:1.2}
.region{fill:none;stroke:#D5D9DE;stroke-width:1;stroke-dasharray:4 4}
.pol{fill:#DCE8F4;stroke:#2E5E8E;stroke-width:1.3}
.up{fill:#F6ECD6;stroke:#9A6B14;stroke-width:1.2}
.miss{fill:none;stroke:#B5443A;stroke-width:1.2;stroke-dasharray:5 4}
.half{fill:#DCE8F4;stroke:#2E5E8E;stroke-width:1.2;stroke-dasharray:5 4}
.logbox{fill:none;stroke:#6B7380;stroke-width:1.2}
.chip{fill:#E6E9EC;stroke:none}
.t{font-size:12.5px;fill:#1B2028}
.ts{font-size:11px;fill:#5C6470}
.tb{font-size:13px;font-weight:600;fill:#1B2028}
.tp{font-size:12px;fill:#1F4569;font-weight:500}
.tu{font-size:12px;fill:#6E4B0B;font-weight:500}
.tw{font-size:12px;fill:#B5443A;font-weight:500}
.tl{font-size:11.5px;fill:#6B7380}
.ar{stroke:#1B2028;stroke-width:1.3;fill:none}
.ar-p{stroke:#2E5E8E;stroke-width:1.6;fill:none}
.ar-l{stroke:#6B7380;stroke-width:1.2;fill:none;stroke-dasharray:4 3}
.ar-w{stroke:#B5443A;stroke-width:1.3;fill:none;stroke-dasharray:5 4}
.lane{stroke:#D5D9DE;stroke-width:1;stroke-dasharray:3 4}
</style>
<rect width="1080" height="580" fill="#FFFFFF"/>
      <defs>
        <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B2028"/></marker>
        <marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E5E8E"/></marker>
        <marker id="ahl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7380"/></marker>
      </defs>

      <!-- harness region -->
      <rect x="180" y="20" width="880" height="425" rx="8" class="region"/>
      <text x="196" y="40" class="ts">에이전트 하네스 — Claude Code 또는 Codex. 정책·에이전트·스킬은 세션 시작 전에 dist/ 파일로 놓인다</text>

      <!-- user -->
      <rect x="20" y="185" width="120" height="64" rx="4" class="box"/>
      <text x="80" y="212" text-anchor="middle" class="tb">사용자</text>
      <text x="80" y="232" text-anchor="middle" class="ts">한국어 지시</text>

      <!-- system prompt layer -->
      <rect x="200" y="58" width="840" height="72" rx="4" class="box"/>
      <text x="214" y="82" class="tb">시스템 프롬프트 층</text>
      <text x="214" y="102" class="ts">세션 시작에 한 번 읽힌다</text>
      <rect x="380" y="72" width="330" height="44" rx="3" class="pol"/>
      <text x="545" y="90" text-anchor="middle" class="tp">정책 — fluent-korean 본문 + 선택 블록</text>
      <text x="545" y="107" text-anchor="middle" class="ts">agent-reply 프로파일 · 문장은 verbatim, 합성만 우리 것</text>
      <text x="730" y="88" class="ts">Claude Code: 출력 스타일, force-for-plugin</text>
      <text x="730" y="106" class="ts">Codex: AGENTS.md 절 (또는 developer_instructions)</text>

      <!-- main agent -->
      <rect x="200" y="170" width="220" height="90" rx="4" class="box"/>
      <text x="310" y="200" text-anchor="middle" class="tb">메인 에이전트</text>
      <text x="310" y="220" text-anchor="middle" class="ts">모델 + 컨텍스트</text>
      <rect x="230" y="232" width="160" height="18" rx="3" class="pol"/>
      <text x="310" y="245" text-anchor="middle" class="tp">정책 적용됨</text>

      <!-- response -->
      <rect x="840" y="180" width="200" height="70" rx="4" class="box"/>
      <text x="940" y="205" text-anchor="middle" class="tb">사용자에게 돌아가는 것</text>
      <text x="940" y="225" text-anchor="middle" class="ts">응답 · 윤문본 · 진단 보고</text>
      <text x="940" y="241" text-anchor="middle" class="ts">변경률은 모델의 자기 보고</text>

      <!-- skills group -->
      <rect x="480" y="300" width="300" height="130" rx="4" class="box"/>
      <text x="494" y="322" class="tb">스킬</text>
      <text x="530" y="322" class="ts">dist/skills/ — 모델이 description을 보고 고른다</text>
      <rect x="494" y="334" width="62" height="24" rx="3" class="chip"/><text x="525" y="350" text-anchor="middle" class="t">ko-route</text>
      <rect x="562" y="334" width="72" height="24" rx="3" class="up"/><text x="598" y="350" text-anchor="middle" class="tu">ko-rewrite</text>
      <rect x="640" y="334" width="78" height="24" rx="3" class="up"/><text x="679" y="350" text-anchor="middle" class="tu">ko-diagnose</text>
      <rect x="724" y="334" width="46" height="24" rx="3" class="up"/><text x="747" y="350" text-anchor="middle" class="tu">ko-gr…</text>
      <rect x="494" y="372" width="272" height="44" rx="3" class="up"/>
      <text x="630" y="390" text-anchor="middle" class="tu">references/taxonomy-*.md</text>
      <text x="630" y="406" text-anchor="middle" class="ts">패턴 목록. 필요할 때만 읽는다 · rewrite와 diagnose는 서로 안 읽음</text>

      <!-- subagent -->
      <rect x="200" y="300" width="220" height="110" rx="4" class="box"/>
      <text x="310" y="324" text-anchor="middle" class="tb">서브에이전트</text>
      <text x="310" y="342" text-anchor="middle" class="ts">korean-reviewer · editor · writer</text>
      <rect x="216" y="354" width="188" height="20" rx="3" class="pol"/>
      <text x="310" y="368" text-anchor="middle" class="tp">정의 파일에 정책 본문이 직접 있음</text>
      <text x="310" y="394" text-anchor="middle" class="tw">출력 스타일은 여기 닿지 않는다</text>

      <!-- arrows -->
      <line x1="140" y1="217" x2="198" y2="217" class="ar" marker-end="url(#ah)"/>
      <text x="169" y="207" text-anchor="middle" class="ts">지시</text>

      <line x1="310" y1="130" x2="310" y2="168" class="ar-p" marker-end="url(#ahp)"/>
      <text x="320" y="153" class="tp">주입</text>

      <line x1="420" y1="215" x2="838" y2="215" class="ar" marker-end="url(#ah)"/>
      <text x="630" y="205" text-anchor="middle" class="ts">응답 (last_assistant_message)</text>

      <polyline points="420,245 450,245 450,345 478,345" class="ar" marker-end="url(#ah)"/>
      <text x="456" y="290" class="ts" transform="rotate(90 456 290)">스킬 호출</text>

      <line x1="260" y1="260" x2="260" y2="298" class="ar-p" marker-end="url(#ahp)"/>
      <text x="200" y="283" class="tp" text-anchor="start" transform="translate(-4 0)">띄운다</text>
      <line x1="370" y1="298" x2="370" y2="262" class="ar" marker-end="url(#ah)"/>
      <text x="378" y="283" class="ts">결과</text>

      <line x1="420" y1="392" x2="478" y2="392" class="ar" marker-end="url(#ah)"/>
      <text x="449" y="383" text-anchor="middle" class="ts">스킬</text>

      <!-- hook row -->
      <text x="200" y="478" class="tl">hook 로거 — 하네스 밖 스크립트. 판정하지 않고 차단하지 않고 transcript를 읽지 않는다</text>
      <rect x="200" y="520" width="110" height="34" rx="3" class="logbox"/><text x="255" y="542" text-anchor="middle" class="tl">SessionStart</text>
      <rect x="330" y="520" width="140" height="34" rx="3" class="logbox"/><text x="400" y="542" text-anchor="middle" class="tl">UserPromptSubmit</text>
      <rect x="490" y="520" width="110" height="34" rx="3" class="logbox"/><text x="545" y="542" text-anchor="middle" class="tl">PostToolUse</text>
      <rect x="620" y="520" width="120" height="34" rx="3" class="logbox"/><text x="680" y="542" text-anchor="middle" class="tl">SubagentStop</text>
      <rect x="760" y="520" width="70" height="34" rx="3" class="logbox"/><text x="795" y="542" text-anchor="middle" class="tl">Stop</text>
      <rect x="870" y="508" width="170" height="58" rx="3" class="logbox"/>
      <text x="955" y="530" text-anchor="middle" class="tl">~/.ko-quality/logs/*.jsonl</text>
      <text x="955" y="548" text-anchor="middle" class="ts">조건 + 원문. 작업 트리 밖</text>
      <line x1="830" y1="537" x2="868" y2="537" class="ar-l" marker-end="url(#ahl)"/>

      <polyline points="80,249 80,490 400,490 400,518" class="ar-l" marker-end="url(#ahl)"/>
      <text x="240" y="503" text-anchor="middle" class="tl">지시 원문</text>
      <polyline points="310,410 310,455 680,455 680,518" class="ar-l" marker-end="url(#ahl)"/>
      <text x="500" y="468" text-anchor="middle" class="tl">agent_type + last_assistant_message</text>
      <polyline points="940,250 940,475 795,475 795,518" class="ar-l" marker-end="url(#ahl)"/>
      <text x="880" y="488" text-anchor="middle" class="tl">last_assistant_message</text>
    </svg>